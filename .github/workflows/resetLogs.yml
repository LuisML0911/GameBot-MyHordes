name: resetLogs

on:
  workflow_dispatch:       # también lo puedes lanzar manualmente

permissions:
  contents: write   # da permiso de escritura al GITHUB_TOKEN
  
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - name: Install canvas dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            libpixman-1-dev
      - name: Install dependencies
        run: npm ci

      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: npx playwright test --reporter=list --grep "resetLogs"
