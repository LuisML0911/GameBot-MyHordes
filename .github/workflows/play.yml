name: Play

on:
  repository_dispatch:
    types: [playByPowerAutomate]
  #schedule:
  #  - cron: "*/30 * * * *"
  workflow_dispatch:       # también lo puedes lanzar manualmente
  
permissions:
  contents: write   # da permiso de escritura al GITHUB_TOKEN
  
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/luisml0911/gamebot-playwright:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
    
      - run: npm ci
    
      - run: npx playwright test --reporter=list --grep "myhordes"
