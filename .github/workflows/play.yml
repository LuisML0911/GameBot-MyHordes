name: Play

on:
  repository_dispatch:
    types: [playByPowerAutomate]
  #schedule:
  #  - cron: "*/30 * * * *"
  workflow_dispatch:       # también lo puedes lanzar manualmente
  
permissions:
  contents: write   # da permiso de escritura al GITHUB_TOKEN
  
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
    - name: Verify ImageMagick
      run: |
        command -v magick || true
        magick --version || true
        dpkg -l | grep imagemagick || true
    - uses: actions/checkout@v5
      with:
        lfs: true
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci

    - uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-v1

    - name: Install ImageMagick if needed
      run: |
        if ! command -v magick >/dev/null 2>&1; then
          echo "Installing ImageMagick..."
          sudo apt-get update
          sudo apt-get install -y imagemagick
        else
          echo "ImageMagick already installed"
          magick --version
        fi
    
    - name: Run Playwright tests
      run: npx playwright test --reporter=list --grep "myhordes"
